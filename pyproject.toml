[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-log-extractors"
version = "0.0.0"
description = "Reusable extractors for Claude, Codex, and Copilot session logs"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
# Only for scripts/fixtures/generate_fixtures.sh's plan-mode/pasted-image
# captures -- the extractors themselves stay stdlib-only (see
# scripts/Dockerfile). Not a runtime or test dependency.
fixtures = ["claude-agent-sdk"]

[tool.setuptools.packages.find]
where = ["src"]
