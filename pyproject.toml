[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-log-extractors"
version = "0.0.0"
description = "Reusable extractors for Claude, Codex, and Copilot session logs"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff==0.14.0", "diff-cover==9.7.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.coverage.run]
source = ["scripts", "src"]
omit = ["scripts/test_*.py"]
