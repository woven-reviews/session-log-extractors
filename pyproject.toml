[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-log-extractors"
version = "0.0.0"
description = "Reusable extractors for Claude, Codex, and Copilot session logs"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff==0.14.0", "diff-cover==9.7.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.coverage.run]
source = ["scripts", "src"]
omit = ["scripts/test_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "C4", "PIE", "PGH004", "RUF100", "PT011", "PT012", "PT017", "C901", "PLR0915", "PLR0912", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12
max-args = 5
