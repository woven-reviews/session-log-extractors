[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-log-extractors"
version = "0.0.0"
description = "Reusable extractors for Claude, Codex, and Copilot session logs"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff==0.14.0",
    "diff-cover==9.7.1",
    "mypy==2.4.0",
    "import-linter==2.15",
    "pre-commit==4.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
session_log_extractors = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_unimported = true
disallow_any_explicit = true
enable_error_code = ["ignore-without-code"]

[tool.coverage.run]
source = ["scripts", "src"]
omit = ["scripts/test_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "C4", "PIE", "PGH004", "RUF100", "PT011", "PT012", "PT017", "C901", "PLR0915", "PLR0912", "PLR0913", "PLC0415", "TID251", "PGH003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12
max-args = 5

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Use typed construction or checked narrowing."
"typing_extensions.cast".msg = "Use typed construction or checked narrowing."
"typing.no_type_check".msg = "Keep type checking enabled."
"typing_extensions.no_type_check".msg = "Keep type checking enabled."

[tool.importlinter]
root_packages = ["session_log_extractors"]

[[tool.importlinter.contracts]]
id = "model-boundary"
name = "Shared model is independent of readers, extractors and export"
type = "forbidden"
source_modules = ["session_log_extractors.session_model"]
forbidden_modules = [
    "session_log_extractors.claude_sources",
    "session_log_extractors.codex_sources",
    "session_log_extractors.copilot_sources",
    "session_log_extractors.extract_claude_session_log",
    "session_log_extractors.extract_codex_session_log",
    "session_log_extractors.extract_copilot_session_log",
    "session_log_extractors.session_log_envelope",
]

[[tool.importlinter.contracts]]
id = "export-boundary"
name = "Exporter is independent of readers and extractors"
type = "forbidden"
source_modules = ["session_log_extractors.session_log_envelope"]
forbidden_modules = [
    "session_log_extractors.claude_sources",
    "session_log_extractors.codex_sources",
    "session_log_extractors.copilot_sources",
    "session_log_extractors.extract_claude_session_log",
    "session_log_extractors.extract_codex_session_log",
    "session_log_extractors.extract_copilot_session_log",
]

[[tool.importlinter.contracts]]
id = "claude-schemas"
name = "Claude schemas belong to Claude and the shared union"
type = "protected"
protected_modules = ["session_log_extractors.tool_inputs.claude"]
allowed_importers = [
    "session_log_extractors.extract_claude_session_log",
    "session_log_extractors.tool_inputs",
]
as_packages = false

[[tool.importlinter.contracts]]
id = "copilot-schemas"
name = "Copilot schemas belong to Copilot and the shared union"
type = "protected"
protected_modules = ["session_log_extractors.tool_inputs.copilot"]
allowed_importers = [
    "session_log_extractors.extract_copilot_session_log",
    "session_log_extractors.tool_inputs",
]
as_packages = false
