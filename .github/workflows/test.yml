name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff-cover diffs against origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .[test]
      - run: pytest --cov --cov-fail-under=95 --cov-report=xml
      - run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=95
