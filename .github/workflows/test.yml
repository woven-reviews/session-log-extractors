name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .[test]
      - run: pytest
      - run: pytest scripts/test_extract_codex_session_log.py --cov=extract_codex_session_log --cov-fail-under=95
