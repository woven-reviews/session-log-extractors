name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          python-version: "3.11"
      - run: uv sync --locked --extra test
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy src scripts/check_type_escapes.py
      - run: uv run --locked pytest --cov=scripts --cov=src --cov-report=term --cov-report=xml --cov-fail-under=95
      - run: git fetch origin main
      - run: uv run --locked python scripts/check_type_escapes.py --compare-branch=origin/main
      - run: uv run --locked diff-cover coverage.xml --compare-branch=origin/main --fail-under=95
      - run: uv run --locked pytest scripts/test_extract_codex_session_log.py --cov=session_log_extractors.extract_codex_session_log --cov-fail-under=95
      - run: >
          uv run --locked pytest scripts/test_extract_claude_session_log.py
          --cov=session_log_extractors.extract_claude_session_log --cov-fail-under=95
      - run: >
          uv run --locked pytest scripts/test_extract_copilot_session_log.py
          --cov=session_log_extractors.extract_copilot_session_log --cov-fail-under=95
