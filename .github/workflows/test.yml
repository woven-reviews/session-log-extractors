name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .[test]
      - run: ruff format --check .
      - run: pytest --cov=scripts --cov=src --cov-report=term --cov-report=xml --cov-fail-under=95
      - run: git fetch origin main
      - run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=95
      - run: pytest scripts/test_extract_codex_session_log.py --cov=extract_codex_session_log --cov-fail-under=95
      - run: >
          pytest scripts/test_extract_claude_session_log.py
          --cov=extract_claude_session_log --cov-fail-under=95
