name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  python-checks:
    uses: ./.github/workflows/test.yml
  host-checks:
    uses: ./.github/workflows/host-hooks.yml
  release:
    needs: [python-checks, host-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("pyproject.toml","rb"))["project"]["version"]'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          python-version: "3.11"
      - run: uv build --no-sources
      - run: sh scripts/package-plugins.sh dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/woven-reviews/session-log-extractors:${{ github.ref_name }}
      - name: Record immutable image reference and checksums
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'ghcr.io/woven-reviews/session-log-extractors@%s\n' "$IMAGE_DIGEST" > dist/capture-image.txt
          cd dist
          sha256sum *.tar.gz *.whl capture-image.txt > SHA256SUMS
      - name: Create draft release for publication verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" --notes "Verify public image visibility and anonymous installation before publishing. See docs/release.md."
