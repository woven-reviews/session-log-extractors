repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: Mypy (entire source package)
        entry: uv run --locked mypy src
        language: system
        pass_filenames: false
        always_run: true
      - id: lint-imports
        name: Import Linter
        entry: uv run --locked lint-imports
        language: system
        pass_filenames: false
        always_run: true
